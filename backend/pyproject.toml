[project]
name = "activequeue-api"
version = "0.1.0"
description = "ActiveQueue API — time-boxing orchestrator backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "google-cloud-firestore>=2.22",
    "firebase-admin>=6.7",
    "structlog>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.16",
    "coverage>=7.8",
    "respx>=0.23.1",
    "pytest-randomly>=5.0.0",
    "jsonschema>=4.23",
]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
    "BLE",  # blind except
    "DTZ",  # naive datetimes
    "ASYNC",# blocking calls in async code
    "ARG",  # unused arguments
    "RET",  # return hygiene
    "PIE",  # misc lints
    "PERF", # performance anti-patterns
    "FURB", # refurb modernisations
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "TRY",  # exception-handling anti-patterns
    "T20",  # stray print()
    "PT",   # pytest style
]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # function call in argument defaults (FastAPI Depends)
    "TC001",   # move import into type-checking block (Pydantic needs runtime types)
    "TC003",   # move stdlib import into type-checking block
    "TRY003",  # long messages on AppError subclasses are the API's error text
    "PLW0603", # module-level singletons (_client, caches) are set via `global` by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is how pytest works
    "S105",    # fake credentials in fixtures
    "S106",
    "ARG001",  # fixtures requested for their side effects
    "ARG002",
]
"app/cli/seed.py" = [
    "T201",    # CLI prints its summary
    "S105",    # published emulator-only test password
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "google.cloud.*",
    "firebase_admin.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "emulator: runs against the Firestore + Auth emulators (tests/emulator/)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# The single backend coverage gate (branch coverage over all of app/). CI,
# `make test-backend`, and scripts/deploy.sh all run `pytest --cov` and read it here.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
]
