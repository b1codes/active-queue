name: Contracts (nightly third-party)

# Checks that the real YouTube Data API v3 and Firebase Auth still match
# contracts/third_party/, the same schemas the recorded fixtures are held to on every PR
# (ClickUp 86bcxruxt). A failure here means a third-party service changed under us:
# update the schema and fixtures together (tests/fixtures/youtube/README.md).
#
# Configuration (Settings > Secrets and variables > Actions):
#   secret   YOUTUBE_API_KEY               a Data API key; the run spends about 8 units
#   variable YOUTUBE_CONTRACT_PLAYLIST_ID  a stable public playlist with 2+ videos
# Without them the YouTube check is skipped with a notice. The Firebase check needs neither.

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily, clear of the 00:00 PT YouTube quota reset
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-nightly
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.2"

jobs:
  third-party:
    name: Third-party contracts (live)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Firebase Auth signing certificates
        working-directory: backend
        env:
          LIVE_CONTRACTS: "1"
        run: uv run pytest -p no:randomly tests/contract/thirdparty/test_firebase_live.py

      - name: YouTube Data API v3
        working-directory: backend
        env:
          LIVE_CONTRACTS: "1"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CONTRACT_PLAYLIST_ID: ${{ vars.YOUTUBE_CONTRACT_PLAYLIST_ID }}
        run: |
          if [ -z "${YOUTUBE_API_KEY}" ] || [ -z "${YOUTUBE_CONTRACT_PLAYLIST_ID}" ]; then
            echo "::notice::YOUTUBE_API_KEY / YOUTUBE_CONTRACT_PLAYLIST_ID not configured; skipping the live YouTube check."
            exit 0
          fi
          uv run pytest -p no:randomly tests/contract/thirdparty/test_youtube_live.py
