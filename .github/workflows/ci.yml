name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Node.js (Firebase emulators)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.33.0

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Run Ruff Lint & Format Checks
        run: |
          cd backend
          uv run ruff check app/ tests/
          uv run ruff format --check app/ tests/

      - name: Run Mypy Type Checking
        run: |
          cd backend
          uv run mypy --strict app/

      - name: Run Pytest Suite (unit + mocked + emulator tiers) & Coverage Gate
        # emulators:exec sets FIRESTORE_EMULATOR_HOST / FIREBASE_AUTH_EMULATOR_HOST.
        # REQUIRE_EMULATOR=1 turns "emulators unreachable" into a failure, not a skip.
        # The coverage threshold lives in backend/pyproject.toml ([tool.coverage.report]).
        env:
          ENV: local
          GCP_PROJECT_ID: demo-activequeue-local
          REQUIRE_EMULATOR: "1"
        run: |
          npx -y firebase-tools@15.33.0 emulators:exec \
            --config firebase.test.json --project demo-activequeue-local --only auth,firestore \
            "cd backend && uv run pytest --cov"

  frontend:
    name: Frontend (React Native Expo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          cd frontend
          pnpm lint

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          pnpm typecheck

      - name: Run Jest (unit, store, component, screen) with coverage gate
        # Thresholds live in frontend/jest.config.js (coverageThreshold) and cover every
        # file under src/ and app/ via collectCoverageFrom. --randomize shuffles order.
        run: |
          cd frontend
          pnpm test:coverage

  terraform:
    name: Infrastructure (Terraform)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: |
          cd infra
          terraform fmt -check

      - name: Terraform Init
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Validate
        # NOTE (SPEC §12.5): `terraform plan` is EXCLUDED until M6 because it requires real GCP credentials.
        run: |
          cd infra
          terraform validate
