name: Fuzz (nightly)

# Long, freshly seeded fuzz runs. PRs run the same suites short and derandomized inside
# CI's normal jobs; this widens the search every night with a new seed, logged so any
# failure reproduces locally (see docs/testing.md#fuzz-and-monkey-tests).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to replay (blank for a fresh one)"
        required: false
      max_examples:
        description: "Examples per API operation"
        required: false
        default: "1000"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.13.2"
  FIREBASE_TOOLS_VERSION: "15.33.0"

jobs:
  api:
    name: API fuzz (Schemathesis on the emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js (Firebase emulators)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Pick and log the seed
        id: seed
        env:
          INPUT_SEED: ${{ inputs.seed }}
          MAX_EXAMPLES: ${{ inputs.max_examples || '1000' }}
        run: |
          seed="${INPUT_SEED:-$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')}"
          echo "seed=${seed}" >> "$GITHUB_OUTPUT"
          echo "::notice title=API fuzz seed::${seed}"
          echo "API fuzz seed \`${seed}\`. Replay: \`make fuzz-api SEED=${seed} FUZZ_MAX_EXAMPLES=${MAX_EXAMPLES}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Schemathesis over every operation in contracts/openapi.json
        env:
          ENV: local
          GCP_PROJECT_ID: demo-activequeue-local
          REQUIRE_EMULATOR: "1"
          FUZZ_MAX_EXAMPLES: ${{ inputs.max_examples || '1000' }}
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          npx -y "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec \
            --config firebase.test.json --project demo-activequeue-local --only auth,firestore \
            "cd backend && uv run pytest -p no:randomly tests/emulator/test_schemathesis_emulator.py --hypothesis-seed=${SEED}"
