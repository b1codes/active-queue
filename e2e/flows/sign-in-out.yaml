# Journey: a wrong password is refused; sign in, see a new account's empty queue, sign out,
# and stay signed out across a relaunch.
appId: com.b1codes.activequeue
name: Sign in and out
---
- runScript:
    file: common/create-account.js
    env:
      NAME: alice
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 30000
# Same checks as common/sign-in.yaml: each field is confirmed by its value.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: sign-in-email
      - waitForAnimationToEnd
      - eraseText: 80
      - inputText: ${output.alice}
      - waitForAnimationToEnd
      - assertVisible:
          id: sign-in-email
          text: ${output.alice}
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: sign-in-password
      - waitForAnimationToEnd
      - eraseText: 40
      - inputText: "not-the-password"
      - waitForAnimationToEnd
      - assertVisible:
          id: sign-in-email
          text: ${output.alice}
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Sign in"
          optional: true
      - extendedWaitUntil:
          visible: ".*Invalid email address or password.*"
          timeout: 45000
- launchApp:
    clearState: true
- runFlow:
    file: common/sign-in.yaml
    env:
      NAME: alice
- assertVisible: "No Content Sources Added"
# Signed in survives a relaunch.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Active Queue"
    timeout: 30000
- runFlow: common/sign-out.yaml
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 30000
