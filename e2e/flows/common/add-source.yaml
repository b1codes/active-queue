# Adds SOURCE through the Add Source sheet and waits for its first items in the queue.
appId: com.b1codes.activequeue
---
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Add Source"
          optional: true
      - extendedWaitUntil:
          visible:
            id: add-source-url
          timeout: 30000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: add-source-url
      - waitForAnimationToEnd
      - eraseText: 60
      - inputText: ${SOURCE}
      - waitForAnimationToEnd
      - assertVisible:
          id: add-source-url
          text: ${SOURCE}
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Add source"
          optional: true
      - extendedWaitUntil:
          notVisible: "Add Content Source"
          timeout: 30000
- extendedWaitUntil:
    visible:
      id: "feed-card-.*"
    timeout: 60000
