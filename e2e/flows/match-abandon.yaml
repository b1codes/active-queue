# Journey: content first. Pick a queued video, pick an activity, start, hand off, then
# abandon: the queue has no active session afterwards and History records the abandon.
appId: com.b1codes.activequeue
name: Match from the queue and abandon
---
- runFlow:
    file: common/new-user.yaml
    env:
      NAME: quitter
- runFlow:
    file: common/add-source.yaml
    env:
      SOURCE: fixture-small-playlist
- tapOn: "Fixture Workout Video #12 — High Intensity Cardio, duration 15:00.*"
- extendedWaitUntil:
    visible: "Strength Training"
    timeout: 30000
- tapOn: "Strength Training"
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Start session"
          optional: true
      - extendedWaitUntil:
          visible: "Skip Tracker Step"
          timeout: 30000
- runFlow: common/hand-off.yaml
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Abandon session"
          optional: true
      - extendedWaitUntil:
          visible: "Active Queue"
          timeout: 30000
- assertNotVisible: "Resume.*"
- tapOn: "History, tab.*"
- extendedWaitUntil:
    visible: "Abandoned strength session, 15:00.*"
    timeout: 30000
